<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment Management | Admin</title>
<meta name="description" content="Grand Meridian Resort - professional hotel booking management system">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/base.css}">
<style>
.pay-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1.2rem}
.pm-chip{display:inline-flex;align-items:center;gap:.4rem;font-size:.75rem;font-weight:650;color:var(--text);background:var(--surface);border:1px solid var(--border);padding:.2rem .6rem;border-radius:99px}
.pm-filterbar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.pm-filterbar .input-affix{width:230px}
</style>
</head>

<body data-chrome="dash" data-active="ap">
<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <header class="topbar" id="topbar"></header>
  <main>
    <div class="page-wrap">
      <div class="row between wrap mb-3">
        <div class="section-title" style="margin:0"><div class="eyebrow">Revenue</div><h2 style="font-family:var(--display)">Payments</h2></div>
      </div>

      <div class="pay-sum" id="paySum"></div>

      <div class="card">
        <div class="card-head">
          <div class="pm-filterbar">
            <div class="input-affix"><span data-icon="search"></span><input class="input" id="paySearch" placeholder="Search booking or guest..."></div>
            <select class="input" id="payStatus" style="width:auto"><option value="">All statuses</option><option>paid</option><option>unpaid</option><option>refunded</option></select>
            <select class="input" id="payBkStatus" style="width:auto"><option value="">All booking statuses</option><option>confirmed</option><option>active</option><option>completed</option><option>pending</option><option>cancelled</option></select>
            <select class="input" id="payMethod" style="width:auto"><option value="">All methods</option><option>Card</option><option>Bank transfer</option><option>Digital wallet</option><option>Cash on arrival</option><option>PayPal</option></select>
            <input class="input" type="date" id="payFrom" title="From date" style="width:auto">
            <input class="input" type="date" id="payTo" title="To date" style="width:auto">
            <input class="input" type="number" id="payMin" placeholder="Min $" title="Minimum amount" style="width:110px">
            <input class="input" type="number" id="payMax" placeholder="Max $" title="Maximum amount" style="width:110px">
            <button class="btn btn-soft" id="payReset">Reset</button>
          </div>
        </div>
        <div class="table-wrap" style="border:0;box-shadow:none;border-radius:0"><table class="tbl" id="payTable"></table></div>
        <div id="payPager" style="padding:1rem 1rem 0"></div>
      </div>
    </div>
  </main>
</div>

<script th:src="@{/js/core.js}"></script>
<script>

App.boot({guard:'staff'});
App.renderDashChrome('ap','Payment Management',[{label:'Dashboard',href:'/admin/dashboard'},{label:'Payments',href:'#'}]);
(function(){
  var st={q:'',status:'',bkStatus:'',method:'',from:'',to:'',min:'',max:'',page:1,per:9};
  var bookings=App.getBookings();
  var PAY_B={paid:'b-success',unpaid:'b-warning',refunded:'b-plain',failed:'b-danger'};
  function payOf(b){ return b.payment==='paid'?'paid':(b.status==='cancelled'?'refunded':'unpaid'); }
  function guestName(id){ var u=App.userById(id); return u?u.name:'Guest'; }
  function sum(f){ return bookings.reduce(function(a,b){return a+(f(b)?(b.totalAmount||0):0);},0); }
  function filteredAll(f){
    return bookings.filter(function(b){
      if(f.status&&payOf(b)!==f.status)return false;
      if(f.bkStatus&&b.status!==f.bkStatus)return false;
      if(f.method&&(b.method||'Card')!==f.method)return false;
      if(f.from&&(!b.createdAt||b.createdAt<f.from))return false;
      if(f.to&&(!b.createdAt||b.createdAt>f.to))return false;
      if(f.min&&(b.totalAmount||0)< +f.min)return false;
      if(f.max&&(b.totalAmount||0)> +f.max)return false;
      if(f.q){ var h=(b.bookingId+' '+guestName(b.userId)).toLowerCase(); if(h.indexOf(f.q.toLowerCase())===-1)return false; }
      return true;
    });
  }
  function refreshSum(){
    var res=filteredAll(st);
    document.getElementById('paySum').innerHTML=[
      ['Revenue collected',App.money(sum(function(b){return payOf(b)==='paid';})),'paid',bookings.filter(function(b){return payOf(b)==='paid';}).length],
      ['Pending',App.money(sum(function(b){return payOf(b)==='unpaid';})),'unpaid',bookings.filter(function(b){return payOf(b)==='unpaid';}).length],
      ['Refunded',App.money(sum(function(b){return payOf(b)==='refunded';})),'refunded',bookings.filter(function(b){return payOf(b)==='refunded';}).length],
      ['Outstanding',App.money(sum(function(b){return payOf(b)==='unpaid'&&b.status!=='cancelled';})),'failed',bookings.filter(function(b){return payOf(b)==='unpaid'&&b.status!=='cancelled';}).length]
    ].map(function(x){ return '<div class="ps-card"><div class="ps-lab">'+x[0]+'</div><div class="ps-num">'+x[1]+'</div><div class="ps-row" style="margin-top:.5rem"><span class="badge '+PAY_B[x[2]]+'">'+App.cap(x[2])+'</span><span class="text-sm" style="color:var(--muted)">'+x[3]+'</span></div></div>'; }).join('');
  }
  function render(){
    var res=filteredAll(st).sort(function(a,b){ return new Date(b.createdAt)-new Date(a.createdAt); });
    refreshSum();
    var pages=Math.max(1,Math.ceil(res.length/st.per));
    if(st.page>pages)st.page=pages;
    var slice=res.slice((st.page-1)*st.per,st.page*st.per);
    var tbl=document.getElementById('payTable');
    if(!res.length){ tbl.innerHTML='<tr><td colspan="8" style="padding:2.4rem;text-align:center;color:var(--muted)">No transactions match your filters.</td></tr>'; }
    else tbl.innerHTML='<thead><tr><th>Booking</th><th>Guest</th><th>Method</th><th>Amount</th><th>Booking</th><th>Payment</th><th>Date</th><th style="text-align:right">Actions</th></tr></thead><tbody>'+
    slice.map(function(b){
      var m={Card:'card','Bank transfer':'bank','Digital wallet':'wallet','Cash on arrival':'cash','PayPal':'card'}[b.method||'Card'];
      return '<tr data-id="'+b.id+'">'+
      '<td class="text-sm strong primary-id">'+b.bookingId+'</td>'+
      '<td><div class="cell-user"><div class="avatar" style="background:var(--grad)">'+initials(guestName(b.userId))+'</div><div class="nm" style="font-size:.85rem">'+App.esc(guestName(b.userId))+'</div></div></td>'+
      '<td><span class="pm-chip">'+App.icon(m,'icon-sm')+' '+(b.method||'Card')+'</span></td>'+
      '<td class="amt"><b>'+App.money(b.totalAmount||0)+'</b></td>'+
      '<td><span class="badge '+stBk(b.status)+'">'+App.cap(b.status)+'</span></td>'+
      '<td><span class="badge '+PAY_B[payOf(b)]+'">'+App.cap(payOf(b))+'</span></td>'+
      '<td class="text-sm" style="color:var(--muted)">'+App.dateStr(b.createdAt)+'</td>'+
      '<td class="actions">'+
      '<button class="btn btn-outline btn-sm" data-mark="'+b.id+'" title="Toggle paid/unpaid">'+App.icon('check','icon')+' Mark</button>'+
      '<button class="btn btn-ghost btn-sm" data-receipt="'+b.id+'" title="View details">'+App.icon('eye','icon')+'</button>'+
      '</td></tr>';
    }).join('')+'</tbody>';
    document.getElementById('payPager').innerHTML=App.pagination(st.page,pages);
    App.initPager(document.getElementById('payPager'),function(p){ st.page=p; render(); });
  }
  function stBk(s){ return {confirmed:'b-primary',active:'b-success',completed:'b-info',pending:'b-warning',cancelled:'b-danger'}[s]||'b-plain'; }
  function initials(n){ return (n||'G').split(' ').map(function(w){return w[0];}).slice(0,2).join('').toUpperCase(); }

  document.getElementById('payTable').addEventListener('click',function(e){
    var mark=e.target.closest('[data-mark]'), rc=e.target.closest('[data-receipt]');
    if(!mark&&!rc)return;
    var id=(mark||rc).dataset.id;
    var b=bookings.find(function(x){return x.id===id;});
    if(mark){
      var nxt=payOf(b)==='paid'?'unpaid':'paid';
      App.saveBookings(bookings.map(function(x){ if(x.id===id){ x.payment=nxt; } return x; }));
      App.toast('Payment marked as '+nxt+'.');
      setTimeout(render,300);
    }
    if(rc){
      App.openForm('Transaction '+b.bookingId,[
        {label:'Guest',type:'label',value:guestName(b.userId)},
        {label:'Booking code',type:'label',value:b.bookingId},
        {label:'Check-in',type:'label',value:App.dateStr(b.checkIn)},
        {label:'Check-out',type:'label',value:App.dateStr(b.checkOut)},
        {label:'Room rate',type:'label',value:App.money(b.roomPrice||0)+' / night'},
        {label:'Nights',type:'label',value:b.nights||0},
        {label:'Discount',type:'label',value:'-'+App.money(b.discountAmount||0)},
        {label:'Extras & services',type:'label',value:App.money(b.servicesTotal||0)},
        {label:'Tax',type:'label',value:App.money(b.taxAmount||0)},
        {label:'Total',type:'label',value:App.money(b.totalAmount||0)},
        {label:'Method',type:'label',value:b.method||'Card'},
        {label:'Status',type:'label',value:App.cap(payOf(b))},
        {label:'Promo code',type:'label',value:b.promoCode||'—'}
      ],'Close').then(function(){});
    }
  });
  document.getElementById('paySearch').addEventListener('input',App.debounce(function(){ st.q=this.value; st.page=1; render(); },250));
  document.getElementById('payStatus').addEventListener('change',function(){ st.status=this.value; st.page=1; render(); });
  document.getElementById('payBkStatus').addEventListener('change',function(){ st.bkStatus=this.value; st.page=1; render(); });
  document.getElementById('payMethod').addEventListener('change',function(){ st.method=this.value; st.page=1; render(); });
  document.getElementById('payFrom').addEventListener('change',function(){ st.from=this.value; st.page=1; render(); });
  document.getElementById('payTo').addEventListener('change',function(){ st.to=this.value; st.page=1; render(); });
  document.getElementById('payMin').addEventListener('change',function(){ st.min=this.value; st.page=1; render(); });
  document.getElementById('payMax').addEventListener('change',function(){ st.max=this.value; st.page=1; render(); });
  document.getElementById('payReset').addEventListener('click',function(){
    st={q:'',status:'',bkStatus:'',method:'',from:'',to:'',min:'',max:'',page:1,per:9};
    ['paySearch','payStatus','payBkStatus','payMethod','payFrom','payTo','payMin','payMax'].forEach(function(id){ var el=document.getElementById(id); if(el.tagName==='SELECT')el.value=''; else el.value=''; });
    render();
  });
  render();
})();
</script>
</body>
</html>
