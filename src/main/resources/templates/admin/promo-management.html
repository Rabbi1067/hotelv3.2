<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promo Codes | Admin</title>
<meta name="description" content="Grand Meridian Resort - professional hotel booking management system">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/base.css}">
<style>
.promo-num{font-family:var(--font);font-weight:800;background:var(--bg);border:1px dashed var(--border-strong);border-radius:9px;padding:.35rem .7rem;display:inline-block;letter-spacing:.04em}
.pm-filterbar{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.pm-filterbar .input-affix{width:250px}
</style>
</head>

<body data-chrome="dash" data-active="apc">
<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <header class="topbar" id="topbar"></header>
  <main>
    <div class="page-wrap">
      <div class="row between wrap mb-3">
        <div class="section-title" style="margin:0"><div class="eyebrow">Coupons</div><h2 style="font-family:var(--display)">Promo codes</h2></div>
        <button class="btn btn-primary" id="addPromo"><span data-icon="plus" class="icon" style="width:16px;height:16px"></span> Create promo</button>
      </div>
      <div class="card">
        <div class="card-head">
          <div class="pm-filterbar">
            <div class="input-affix"><span data-icon="search"></span><input class="input" id="pcSearch" placeholder="Search code or description..."></div>
            <select class="input" id="pcStatus" style="width:auto"><option value="">All statuses</option><option>active</option><option>expired</option><option>paused</option></select>
            <select class="input" id="pcType" style="width:auto"><option value="">All discount types</option><option value="percent">Percentage</option><option value="fixed">Fixed amount</option></select>
            <input class="input" type="date" id="pcFrom" title="Valid on or after" style="width:auto">
            <input class="input" type="date" id="pcTo" title="Valid until" style="width:auto">
            <button class="btn btn-soft" id="pcReset">Reset</button>
          </div>
        </div>
        <div class="table-wrap" style="border:0;box-shadow:none;border-radius:0"><table class="tbl" id="promoTable"></table></div>
      </div>
    </div>
  </main>
</div>

<script th:src="@{/js/core.js}"></script>
<script>

App.boot({guard:'admin'});
App.renderDashChrome('apc','Promo Codes',[{label:'Dashboard',href:'/admin/dashboard'},{label:'Promo codes',href:'#'}]);
(function(){
  var tbl=document.getElementById('promoTable');
  var st={q:'',status:'',type:'',from:'',to:'',page:1,per:9};
  function all(){ return App.getPromoCodes(); }
  function statusOf(p){
    if(p.status==='active'&&+new Date(p.end)>=App.today())return ['Active','b-success'];
    if(p.status==='active'&&+new Date(p.end)<App.today())return ['Expired','b-danger'];
    if(p.status==='paused')return ['Paused','b-plain'];
    return ['Expired','b-danger'];
  }
  function filtered(){
    return all().filter(function(p){
      if(st.q){ var h=(p.code+' '+(p.desc||'')).toLowerCase(); if(h.indexOf(st.q.toLowerCase())===-1)return false; }
      if(st.status){ var cur=statusOf(p)[0].toLowerCase(); if(cur!==st.status.toLowerCase())return false; }
      if(st.type&&(p.type||'percent')!==st.type)return false;
      if(st.from&&(!p.end||p.end<st.from))return false;
      if(st.to&&(!p.end||p.end>st.to))return false;
      return true;
    });
  }
  function render(){
    var list=filtered();
    if(!list.length){ tbl.innerHTML='<tr><td colspan="7" style="padding:2.4rem;text-align:center;color:var(--muted)">No promo codes match your search or filters.</td></tr>'; return; }
    tbl.innerHTML='<thead><tr><th>Code</th><th>Discount</th><th>Min. spend</th><th>Usage</th><th>Valid until</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead><tbody>'+
    list.map(function(p){
      var used=p.used||0, lim=p.usageLimit||0, st2=statusOf(p);
      var pct=lim?Math.min(100,Math.round(used/lim*100)):0;
      var roomId=p.roomId;
      return '<tr data-id="'+p.id+'">'+
      '<td><span class="promo-num">'+App.esc(p.code)+'</span></td>'+
      '<td class="strong">'+(p.type==='fixed'?App.money(p.value)+' off':p.value+'% off')+'</td>'+
      '<td class="text-sm">'+(p.minAmount?App.money(p.minAmount):'—')+'</td>'+
      '<td><div class="row" style="gap:.5rem"><div class="prog"><i style="width:'+pct+'%"></i></div><span class="text-xs" style="color:var(--muted)">'+used+(lim?' / '+lim:'')+'</span></div></td>'+
      '<td class="text-sm">'+(p.end?App.dateStr(p.end):'—')+'</td>'+
      '<td><span class="badge '+st2[1]+'">'+st2[0]+'</span></td>'+
      '<td class="actions">'+
      '<button class="btn btn-ghost btn-sm" data-edit="'+p.id+'" title="Edit">'+App.icon('edit','icon')+'</button>'+
      '<button class="btn btn-ghost btn-sm" data-toggle="'+p.id+'" title="Toggle">'+App.icon('power','icon')+'</button>'+
      '<button class="btn btn-danger btn-sm" data-del="'+p.id+'" title="Delete">'+App.icon('trash','icon')+'</button>'+
      '</td></tr>';
    }).join('')+'</tbody>';
    tbl.querySelectorAll('[data-edit]').forEach(function(b){ b.addEventListener('click',function(){ edit(all().find(function(p){return p.id===b.dataset.edit;})); }); });
    tbl.querySelectorAll('[data-toggle]').forEach(function(b){ b.addEventListener('click',function(){
      var p=all().find(function(x){return x.id===b.dataset.toggle;});
      var nxt=p.status==='active'?'paused':'active';
      App.savePromoCodes(all().map(function(x){ if(x.id===p.id){ x.status=nxt; } return x; }));
      App.toast('Promo '+(nxt==='active'?'activated.':'paused.'));
      render();
    }); });
    tbl.querySelectorAll('[data-del]').forEach(function(b){ b.addEventListener('click',function(){
      var p=all().find(function(x){return x.id===b.dataset.del;});
      App.openConfirm('Delete promo?','Code "'+p.code+'" will be removed.',{variant:'danger',confirmText:'Delete'}).then(function(ok){
        if(!ok)return;
        App.savePromoCodes(all().filter(function(x){return x.id!==p.id;}));
        App.toast('Promo deleted.','info');
        render();
      });
    }); });
  }
  function edit(p){
    App.openForm(p?'Edit promo':'New promo code',[
      {id:'pCode',label:'Code',type:'text',req:true,value:p?p.code:'',placeholder:'e.g. SUMMER20'},
      {id:'pType',label:'Type',type:'select',value:p?(p.type||'percent'):'percent',options:['percent:Percentage (%)','fixed:Fixed amount ($)']},
      {id:'pValue',label:'Value',type:'number',req:true,value:p?p.value:10,placeholder:'10 or 25'},
      {id:'pMin',label:'Min. spend ($)',type:'number',value:p?(p.minAmount||''):'',placeholder:'0'},
      {id:'pLimit',label:'Usage limit',type:'number',value:p?(p.usageLimit||''):'',placeholder:'Unlimited'},
      {id:'pRoom',label:'Applies to room',type:'select',value:p&&p.roomId?p.roomId:'',options:[''].concat(App.getRooms().map(function(r){return r.id+':'+r.name;}))},
      {id:'pStatus',label:'Status',type:'select',value:p?(p.status||'active'):'active',options:['active:Active','paused:Paused']},
      {id:'pExp',label:'Valid until',type:'date',value:p?(p.end?p.end:''):''}
    ],p?'Save changes':'Create promo').then(function(v){
      if(!v)return;
      var rec={ id:p?p.id:('pc'+Date.now()),
        code:(v.pCode||'').toUpperCase().replace(/\s+/g,''),
        type:v.pType, value:+v.pValue||0, minAmount:+v.pMin||0,
        usageLimit:+v.pLimit||0, used:p?(p.used||0):0,
        start:p?p.start:App.fmtDateISO(App.today()),
        end:v.pExp?App.toInput(v.pExp):(p?(p.end||null):null),
        roomId:v.pRoom||null, status:v.pStatus||'active', desc:p?p.desc:'' };
      if(!rec.code){ App.toast('Promo code required.','warning'); return; }
      if(all().some(function(x){return x.code===rec.code&&x.id!==rec.id;})){ App.toast('That code already exists.','warning'); return; }
      App.savePromoCodes(p?all().map(function(x){return x.id===rec.id?rec:x;}):all().concat(rec));
      App.toast(p?'Promo updated.':'Promo created.');
      render();
    });
  }
  document.getElementById('addPromo').addEventListener('click',function(){ edit(null); });
  document.getElementById('pcSearch').addEventListener('input',App.debounce(function(){ st.q=this.value; st.page=1; render(); },250));
  document.getElementById('pcStatus').addEventListener('change',function(){ st.status=this.value; render(); });
  document.getElementById('pcType').addEventListener('change',function(){ st.type=this.value; render(); });
  document.getElementById('pcFrom').addEventListener('change',function(){ st.from=this.value; render(); });
  document.getElementById('pcTo').addEventListener('change',function(){ st.to=this.value; render(); });
  document.getElementById('pcReset').addEventListener('click',function(){
    st={q:'',status:'',type:'',from:'',to:'',page:1,per:9};
    ['pcSearch','pcStatus','pcType','pcFrom','pcTo'].forEach(function(id){ var el=document.getElementById(id); el.value=id==='pcFrom'||id==='pcTo'?'':''; if(id==='pcStatus'||id==='pcType')el.value=''; });
    render();
  });
  render();
})();
</script>
</body>
</html>
