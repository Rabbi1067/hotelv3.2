<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Management | Admin</title>
<meta name="description" content="Grand Meridian Resort - professional hotel booking management system">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/base.css}">
<style>
.rm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.1rem}
.rm-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);transition:.16s}
.rm-card:hover{box-shadow:var(--shadow)}
.rm-card .rm-img{position:relative;height:150px}
.rm-card .rm-img img{width:100%;height:100%;object-fit:cover}
.rm-card .rm-body{padding:.95rem 1.05rem 1.05rem}
.status-legend{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1.1rem;font-size:.8rem;color:var(--muted)}
.status-legend span{display:inline-flex;align-items:center;gap:.4rem}
</style>
</head>

<body data-chrome="dash" data-active="ar">
<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <header class="topbar" id="topbar"></header>
  <main>
    <div class="page-wrap">
      <div class="row between wrap mb-3">
        <div class="section-title" style="margin:0"><div class="eyebrow">Inventory</div><h2 style="font-family:var(--display)">Rooms &amp; suites</h2></div>
        <div class="row" style="gap:.6rem">
          <div class="input-affix"><span data-icon="search"></span><input class="input" id="rmSearch" placeholder="Search rooms..." style="width:230px"></div>
          <select class="input" id="rmStatus" style="width:auto"><option value="">All statuses</option><option>available</option><option>occupied</option><option>reserved</option><option>maintenance</option><option>cleaning</option></select>
          <a class="btn btn-primary" th:href="@{/admin/room-form}"><span data-icon="plus" class="icon" style="width:16px;height:16px"></span> Add room</a>
        </div>
      </div>

      <div class="status-legend" id="legend"></div>
      <div class="rm-grid" id="rmGrid"></div>
    </div>
  </main>
</div>

<script th:src="@{/js/core.js}"></script>
<script>

App.boot({guard:'staff'});
App.renderDashChrome('ar','Room Management',[{label:'Dashboard',href:'/admin/dashboard'},{label:'Rooms',href:'#'}]);
(function(){
  var st={q:'',status:''};
  var grid=document.getElementById('rmGrid');
  var legend=document.getElementById('legend');
  var counts=App.ROOM_STATUS.map(function(s){ return {s:s,n:App.getRooms().filter(function(r){return r.status===s;}).length}; });
  legend.innerHTML=counts.map(function(c){
    return '<span><span class="avail-dot '+c.s+'"></span>'+App.cap(c.s)+' ('+c.n+')</span>';
  }).join('')+'<span class="row" style="margin-left:auto;gap:.6rem"><a class="btn btn-outline btn-sm" th:href="@{/admin/dashboard}">Analytics</a></span>';

  function filtered(){ return App.getRooms().filter(function(r){
    if(st.q){ var h=(r.name+' '+r.type+' '+r.number).toLowerCase(); if(h.indexOf(st.q.toLowerCase())===-1)return false; }
    if(st.status&&r.status!==st.status)return false;
    return true;
  }); }
  function render(){
    var res=filtered();
    if(!res.length){ grid.innerHTML=App.emptyState('bed','No rooms found','Try a different search or status.','<a class="btn btn-soft btn-sm" href="/admin/room-form">Add a room</a>'); return; }
    grid.innerHTML=res.map(function(r){
      var pct=r.discount||0, final=r.price-(r.price*pct/100);
      return '<div class="rm-card" data-id="'+r.id+'"><div class="rm-img"><img src="'+r.images[0]+'" alt="" loading="lazy" onerror="this.style.background=\'#0d3a36\'">'+(pct?'<span class="discount-pill">'+pct+'% OFF</span>':'')+'<span class="badge '+(r.featured?'b-accent':'b-plain')+'" style="position:absolute;top:10px;right:10px">'+(r.featured?'Featured':'')+'</span></div>'+
      '<div class="rm-body">'+
      '<div class="row between"><span class="rc-type" style="color:var(--accent);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase">'+r.type+'</span><span class="text-xs" style="color:var(--muted)">Rm '+r.number+'</span></div>'+
      '<h3 style="font-size:1rem;margin:.3rem 0">'+r.name+'</h3>'+
      '<div class="row mt-1" style="gap:.5rem;flex-wrap:wrap">'+statusBadge(r.status)+'<span class="badge b-plain"><span data-icon="users" style="width:12px;height:12px"></span> '+r.capacity+'</span>'+(r.petFriendly?'<span class="badge b-info">Pet friendly</span>':'')+'</div>'+
      '<div class="row mt-2" style="justify-content:space-between;align-items:baseline"><span class="strong" style="font-size:1.1rem">'+App.money(final)+'</span><span class="text-xs" style="color:var(--muted)">'+(r.rating)+' <span class="stars" style="color:var(--accent)">'+App.stars(r.rating)+'</span></span></div>'+
      '<div class="row mt-3" style="gap:.45rem">'+
      '<a class="btn btn-outline btn-sm grow" href="/admin/room-form?id='+r.id+'">Edit</a>'+
      '<button class="btn btn-ghost btn-sm" data-dupe="'+r.id+'" title="Duplicate">'+App.icon('copy','icon-sm')+'</button>'+
      '<button class="btn btn-ghost btn-sm" data-avail="'+r.id+'" title="Toggle availability">'+App.icon('refresh','icon-sm')+'</button>'+
      '<button class="btn btn-danger btn-sm" data-del="'+r.id+'" title="Delete">'+App.icon('trash','icon-sm')+'</button>'+
      '</div></div></div>';
    }).join('');
    grid.querySelectorAll('[data-del]').forEach(function(b){
      b.addEventListener('click',function(){
        var id=b.closest('.rm-card').dataset.id;
        App.openConfirm('Delete room?','Room '+nameOf(id)+' will be permanently removed. This action cannot be undone.').then(function(ok){
          if(!ok)return;
          App.saveRooms(App.getRooms().filter(function(r){return r.id!==id;}));
          App.toast('Room deleted.');
          render();
        });
      });
    });
    grid.querySelectorAll('[data-dupe]').forEach(function(b){
      b.addEventListener('click',function(){
        var id=b.closest('.rm-card').dataset.id;
        var r=App.roomById(id); var copy=JSON.parse(JSON.stringify(r));
        copy.id='r'+Date.now(); copy.name=r.name+' (copy)'; copy.number=r.number+'B'; copy.createdAt=Date.now();
        var rooms=App.getRooms(); rooms.push(copy); App.saveRooms(rooms);
        App.toast('Room duplicated.');
        render();
      });
    });
    grid.querySelectorAll('[data-avail]').forEach(function(b){
      b.addEventListener('click',function(){
        var id=b.closest('.rm-card').dataset.id;
        var r=App.roomById(id);
        App.saveRooms(App.getRooms().map(function(x){ if(x.id!==id)return x; x.status=x.status==='available'?'maintenance':'available'; return x; }));
        App.toast(r.name+' is now '+(r.status==='available'?'under maintenance.':'available.'));
        render();
      });
    });
  }
  function nameOf(id){ var r=App.roomById(id); return r?r.name:id; }
  function statusBadge(s){ return '<span class="badge '+({available:'b-success',occupied:'b-danger',reserved:'b-warning',maintenance:'b-plain',cleaning:'b-info'}[s]||'b-plain')+'">'+App.cap(s)+'</span>'; }

  document.getElementById('rmSearch').addEventListener('input',App.debounce(function(){ st.q=this.value; render(); },250));
  document.getElementById('rmStatus').addEventListener('change',function(){ st.status=this.value; render(); });
  render();
})();
</script>
</body>
</html>
